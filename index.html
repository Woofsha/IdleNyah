<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IdleNyah — Cozy Maid Estate & Creature Sanctuary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Silkscreen', 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #14121e;
      color: #f0e6ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app-container {
      position: relative;
      /* Responsive aspect-ratio scaling up to fill screen */
      width: min(100vw, calc(100vh * 1.5));
      height: min(100vh, calc(100vw / 1.5));
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1820;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      touch-action: none;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background-color: #14121e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-title {
      font-size: 24px;
      font-weight: bold;
      color: #a97bff;
      text-shadow: 2px 2px #000;
      letter-spacing: 2px;
    }

    .loading-sub {
      font-size: 14px;
      color: #c98a52;
      letter-spacing: 1px;
    }

    .pixel-spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #362f4b;
      border-top-color: #a97bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="loading-overlay">
      <div class="loading-title">IDLENYAH</div>
      <div class="loading-sub">Preparing Master's Estate...</div>
      <div class="pixel-spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
